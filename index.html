<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape Plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&family=Press+Start+2P&display=swap" />
    <style>
      /* Liquid Glass v2 (design/look.md). Values mirror design/tokens.ts. */
      :root {
        color-scheme: light;
        --bg: #eef2f8; --glass: rgba(255,255,255,0.62); --glass-strong: rgba(255,255,255,0.86);
        --line-soft: #c3cde2; --accent: #2f5bff; --accent-deep: #2146d6;
        --ink: #0f172a; --ink-muted: #475569; --ink-dim: #64748b;
        --pass-tint: #dcf5ea; --pass-ink: #05603f; --fail-tint: #fde7e8; --fail-ink: #b4232a;
        --shadow-glass: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 0 1px rgba(255,255,255,0.55), 0 1px 2px rgba(15,23,42,0.05), 0 12px 32px rgba(15,23,42,0.08);
        --ease: cubic-bezier(0.32, 0.72, 0, 1);
        font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; overflow: hidden; color: var(--ink);
        background:
          radial-gradient(40vw 30vw at 18% 20%, rgba(47,91,255,0.10), transparent 70%),
          radial-gradient(36vw 28vw at 82% 30%, rgba(224,71,158,0.08), transparent 70%),
          radial-gradient(44vw 30vw at 50% 90%, rgba(14,165,198,0.10), transparent 70%), var(--bg);
      }
      /* The model fills the screen; the panel is a glass card floating over it. */
      #viewer { position: fixed; inset: 0; }
      aside {
        position: fixed; top: 16px; right: 16px; bottom: 16px; width: 340px;
        display: flex; flex-direction: column; gap: 12px; padding: 20px; overflow-y: auto;
        border-radius: 24px; background: var(--glass); box-shadow: var(--shadow-glass);
        backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
      }
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        aside { background: rgba(255,255,255,0.94); }
      }
      h1 { margin: 0; font: 16px/1.4 "Press Start 2P", monospace; letter-spacing: 1px; }
      h2 { margin: 4px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; color: var(--ink-muted); }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
      button {
        font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: 1.2px; cursor: pointer;
        min-height: 44px; padding: 10px 18px; border: 0; border-radius: 9999px;
        transition: transform 120ms var(--ease), box-shadow 240ms var(--ease), background 240ms var(--ease);
      }
      button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      button:active:not(:disabled) { transform: scale(0.97); }
      button:disabled { opacity: 0.45; cursor: default; }
      .actions { display: flex; gap: 8px; }
      #escape {
        flex: 1; background: var(--accent); color: #fff; font: 16px "Press Start 2P", monospace;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 8px 24px rgba(47,91,255,0.35);
      }
      #escape:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 12px 40px rgba(47,91,255,0.55); }
      #escape:active { background: var(--accent-deep); }
      #reset { background: var(--glass-strong); color: var(--accent); box-shadow: inset 0 0 0 1px var(--line-soft); text-transform: uppercase; }
      #edits { display: grid; gap: 8px; }
      button.edit { text-align: left; background: rgba(47,91,255,0.12); color: var(--accent-deep); border-radius: 16px; }
      button.edit[aria-pressed='true'] { background: var(--pass-tint); color: var(--pass-ink); opacity: 1; }
      button.edit[aria-pressed='true']::before { content: '\2713  '; }
      li {
        position: relative; padding: 10px 12px 10px 34px; border-radius: 16px;
        background: var(--glass-strong); font-weight: 700; letter-spacing: 0.4px;
      }
      li::before { content: ''; position: absolute; left: 12px; top: 14px; width: 12px; height: 12px; border-radius: 4px; background: var(--token); }
      li[data-status='pass'] { background: var(--pass-tint); color: var(--pass-ink); }
      li[data-status='fail'] { background: var(--fail-tint); color: var(--fail-ink); }
      li .detail { font-size: 14px; font-weight: 400; margin-top: 2px; color: var(--ink); }
      #banner { font: 18px/1.4 "Press Start 2P", monospace; color: var(--accent); }
      #banner:empty { display: none; }
      .note { margin: auto 0 0; font-size: 13px; color: var(--ink-dim); }
      /* Narrow windows: the panel becomes a bottom sheet so the model keeps the top of the screen. */
      @media (max-width: 760px) {
        aside { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 48vh; padding: 16px; }
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <aside>
      <h1>ESCAPE PLAN</h1>
      <div class="actions">
        <button id="escape" type="button">ESCAPE!</button>
        <button id="reset" type="button">Reset</button>
      </div>
      <h2>EDITS</h2>
      <div id="edits"></div>
      <h2>SCOREBOARD</h2>
      <ul id="scoreboard"></ul>
      <div id="banner"></div>
      <p class="note">Starter build: the solver is a stub until P1 adds token rules.</p>
    </aside>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
