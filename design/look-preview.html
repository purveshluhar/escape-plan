<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape Plan look preview</title>
    <style>
      body { margin: 0; background: #000; color: #fff; min-height: 100vh; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
      h1 { margin: 0; font-size: 22px; letter-spacing: 0.08em; }
      .note { margin: 0; opacity: 0.75; font-size: 14px; max-width: 70ch; line-height: 1.5; }
      .stage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
      svg { width: 100%; height: auto; display: block; }
      .controls { display: flex; flex-wrap: wrap; gap: 10px; }
      button { font-size: 11px; padding: 12px 14px; background: transparent; border-radius: 4px; cursor: pointer; letter-spacing: 0.06em; }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      li { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border: 2px solid; border-radius: 4px; }
      .disc { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #000; font-size: 11px; }
      .row-top { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; }
      .row-detail { font-size: 13px; margin-top: 4px; }
      .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
      .sw { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; font-size: 13px; }
      .sw i { width: 28px; height: 28px; border-radius: 4px; display: block; border: 1px solid #333; }
      .sw small { display: block; opacity: 0.7; font-family: monospace; }
      @media (max-width: 820px) { .stage { grid-template-columns: minmax(0, 1fr); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 id="title">ESCAPE PLAN</h1>
      <p class="note">Look preview for P4. Fake building and fake results, drawn with the real values in
        design/tokens.ts, so changes there show up here. Spec: design/look.md.</p>
      <div class="controls">
        <button type="button" id="play-base">ESCAPE! BASE</button>
        <button type="button" id="play-shaft">WIDEN SHAFT</button>
        <button type="button" id="play-win">ALL FIXES</button>
      </div>
      <div class="stage">
        <svg id="maze" viewBox="0 0 800 480" role="img" aria-label="Maze-style building preview"></svg>
        <ul id="board" aria-live="polite"></ul>
      </div>
      <div class="swatches" id="swatches"></div>
    </div>
    <script type="module" src="./look-preview.ts"></script>
  </body>
</html>
