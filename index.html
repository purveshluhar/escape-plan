<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape Plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&family=Press+Start+2P&display=swap" />
    <style>
      /* The 12-sheet layout from design/flow.md, in Liquid Glass v2 (values from design/tokens.ts).
         The model fills the screen; glass chrome floats over it: HUD top, one card right, the
         action bar bottom, pop-ups for inputs. */
      :root {
        color-scheme: light;
        --bg: #eef2f8; --line-soft: #c3cde2; --line: #7184ae;
        --ink: #0f172a; --ink-muted: #475569; --ink-dim: #64748b;
        --accent: #2f5bff; --accent-deep: #2146d6; --accent-tint: rgba(47, 91, 255, 0.12);
        --pass: #0e9f6e; --pass-tint: #dcf5ea; --pass-ink: #05603f;
        --fail: #e5484d; --fail-tint: #fde7e8; --fail-ink: #b4232a;
        --glass: rgba(255, 255, 255, 0.62); --glass-strong: rgba(255, 255, 255, 0.86);
        --glass-blur: blur(24px) saturate(180%);
        --shadow-glass: inset 0 1px 0 rgba(255, 255, 255, 0.95), inset 0 0 0 1px rgba(255, 255, 255, 0.55),
          0 1px 2px rgba(15, 23, 42, 0.05), 0 12px 32px rgba(15, 23, 42, 0.08);
        --shadow-alert: inset 0 0 0 1px rgba(229, 72, 77, 0.45), 0 12px 32px rgba(229, 72, 77, 0.18);
        --ease: cubic-bezier(0.32, 0.72, 0, 1);
        --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
        --pixel: 'Press Start 2P', 'Courier New', monospace;
        --data: 'JetBrains Mono', ui-monospace, Menlo, monospace;
        --gutter: 20px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; overflow: hidden; font-family: var(--body); color: var(--ink);
        background:
          radial-gradient(520px 360px at 18% 20%, rgba(47, 91, 255, 0.1), transparent 70%),
          radial-gradient(480px 340px at 82% 30%, rgba(224, 71, 158, 0.08), transparent 70%),
          radial-gradient(560px 380px at 50% 90%, rgba(14, 165, 198, 0.1), transparent 70%), var(--bg);
      }
      button { font: inherit; cursor: pointer; border: 0; }
      button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      [hidden] { display: none !important; }

      #viewer { position: fixed; inset: 0; }
      /* The app shows LEVEL COMPLETE in its own dialog (sheet 10), so the viewer's banner stays off. */
      #viewer .ep-banner { display: none; }

      .glass {
        background: var(--glass); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--shadow-glass);
      }
      @supports not (backdrop-filter: blur(1px)) { .glass { background: rgba(255, 255, 255, 0.94); } }

      /* HUD */
      .hud { position: fixed; top: 16px; height: 52px; border-radius: 16px; display: flex; align-items: center; gap: 14px; padding: 0 18px; z-index: 2; }
      .hud.left { left: var(--gutter); }
      .hud.right { right: var(--gutter); }
      .word { font: 14px var(--pixel); letter-spacing: 1px; margin: 0; }
      .lbl { font: 700 12px/16px var(--body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-muted); }
      .pips { display: flex; gap: 5px; }
      .pip { width: 12px; height: 12px; border-radius: 50%; background: var(--line-soft); }
      .pip.ok { background: var(--pass); }
      .pip.bad { background: var(--fail); }
      .count { font: 700 15px var(--data); }
      .b { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 999px; font: 700 11px/1 var(--body); letter-spacing: 1.2px; white-space: nowrap; }
      .b-ok { background: var(--pass-tint); color: var(--pass-ink); }
      .b-bad { background: var(--fail-tint); color: var(--fail-ink); }
      .b-acc { background: var(--accent-tint); color: var(--accent-deep); }

      .hint, .source { position: fixed; left: 50%; transform: translateX(-50%); border-radius: 999px; padding: 8px 16px; font-size: 13px; color: var(--ink-muted); white-space: nowrap; z-index: 2; margin: 0; }
      .hint { top: 84px; }
      .source { bottom: 92px; font-size: 12px; }

      /* Banner (CONFLICT!) */
      .chip { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); border-radius: 16px; padding: 10px 18px; display: flex; align-items: center; gap: 12px; white-space: nowrap; z-index: 3; background: var(--glass-strong); box-shadow: var(--shadow-alert); animation: drop 240ms var(--ease); }
      .pix { font: 18px var(--pixel); }
      .pix.bad { color: var(--fail-ink); }
      @keyframes drop { from { opacity: 0; transform: translate(-50%, -8px); } }

      /* Context card, right */
      .card { position: fixed; right: var(--gutter); top: 84px; width: 320px; max-height: calc(100vh - 84px - 100px); overflow-y: auto; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 2; animation: slide 240ms var(--ease); }
      .card.alert { box-shadow: var(--shadow-alert); background: var(--glass-strong); }
      @keyframes slide { from { opacity: 0; transform: translateX(12px); } }
      .ttl { font: 700 20px/26px var(--body); }
      .ttl.bad { color: var(--fail-ink); }
      .p { font-size: 15px; line-height: 21px; margin: 0; }
      .muted { color: var(--ink-muted); }
      .step { font: 700 11px var(--body); letter-spacing: 1.2px; color: var(--accent-deep); }
      .keys { font-size: 12px; color: var(--ink-dim); }
      .nums { display: flex; gap: 8px; }
      .num { flex: 1; border-radius: 10px; background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--line-soft); padding: 6px 10px; }
      .num b { display: block; font: 700 26px/30px var(--data); }
      .num.bad b { color: var(--fail-ink); }
      .callout { border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 18px; background: var(--fail-tint); color: var(--fail-ink); }
      .callout.info { background: rgba(47, 91, 255, 0.08); color: var(--accent-deep); }
      .opt { display: flex; align-items: center; gap: 10px; border-radius: 10px; padding: 8px 10px; background: var(--glass-strong); box-shadow: 0 0 0 2px var(--accent); font-size: 14px; }
      .opt .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 4px var(--accent); flex: none; }
      .opt b { flex: 1; }

      /* Buttons */
      .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 999px; font: 700 13px var(--body); letter-spacing: 1.3px; text-transform: uppercase; padding: 0 18px; transition: transform 120ms var(--ease); }
      .btn:active { transform: scale(0.98); }
      .btn.fill { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 8px 24px rgba(47, 91, 255, 0.35); }
      .btn.tint { background: var(--accent-tint); color: var(--accent-deep); }
      .btn.glass { background: var(--glass-strong); color: var(--accent); box-shadow: inset 0 0 0 1px var(--line-soft); }
      .btn.danger { background: var(--fail); color: #fff; }
      .btn.off { opacity: 0.45; pointer-events: none; }
      .row2 { display: flex; gap: 8px; }
      .row2 .btn { flex: 1; }
      .row2.narrow { width: min(420px, 100%); }

      /* Action bar, bottom */
      .bar { position: fixed; left: var(--gutter); right: var(--gutter); bottom: 16px; height: 64px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; z-index: 2; pointer-events: none; }
      .bar > * { pointer-events: auto; }
      .bar .r { display: flex; justify-content: flex-end; }
      .pill { height: 40px; padding: 0 16px; border-radius: 999px; font: 700 12px var(--body); letter-spacing: 1.2px; color: var(--ink-muted); }
      .pill:disabled { opacity: 0.45; cursor: default; }
      .esc { width: 320px; height: 60px; border-radius: 999px; background: var(--accent); color: #fff; font: 20px var(--pixel); letter-spacing: 1px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 8px 24px rgba(47, 91, 255, 0.35); transition: box-shadow 240ms var(--ease), background 240ms var(--ease); }
      .esc.small { font-size: 14px; }
      .esc.pulse { animation: pulse 1.2s var(--ease) infinite alternate; }
      .esc.quiet { background: var(--glass-strong); color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
      .esc:disabled { background: var(--line-soft); color: #fff; box-shadow: none; opacity: 0.6; cursor: default; }
      @keyframes pulse { to { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 12px 40px rgba(47, 91, 255, 0.55), 0 0 0 6px rgba(47, 91, 255, 0.12); } }
      .views { display: flex; gap: 2px; padding: 4px; border-radius: 999px; }
      .views span { height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 999px; font: 700 11px var(--body); letter-spacing: 1.2px; color: var(--ink-muted); }
      .views span.on { background: #fff; color: var(--accent); box-shadow: 0 0 0 1px var(--line-soft); }

      /* Pop-ups */
      .scrim { position: fixed; inset: 0; background: rgba(238, 242, 248, 0.35); z-index: 4; }
      .dlg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-height: calc(100vh - 40px); overflow-y: auto; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 14px; background: var(--glass-strong); z-index: 5; animation: pop 240ms var(--ease); }
      .dlg.wide { width: min(620px, calc(100vw - 32px)); }
      .dlg.mid { width: min(520px, calc(100vw - 32px)); }
      .dlg.small { width: min(480px, calc(100vw - 32px)); }
      .dlg.center { align-items: center; text-align: center; }
      @keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(0.98); } }
      .ocard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border-radius: 16px; padding: 10px 12px; background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--line-soft); color: inherit; }
      button.ocard:hover { box-shadow: inset 0 0 0 1px var(--line); }
      .ocard.on { box-shadow: 0 0 0 2px var(--accent), 0 8px 24px rgba(47, 91, 255, 0.18); }
      .ocard kbd { font: 700 12px var(--data); color: var(--ink-dim); }
      .who { flex: 1; min-width: 0; }
      .who b { display: block; font: 700 14px/18px var(--body); letter-spacing: 1.3px; }
      .who span { font-size: 13px; color: var(--ink-muted); }
      .tile { width: 30px; height: 30px; border-radius: 9px; background: #fff; display: flex; align-items: center; justify-content: center; font: 11px var(--pixel); box-shadow: inset 0 -3px 0 var(--c); flex: none; }
      .tile i { display: flex; width: 22px; height: 20px; border-radius: 5px; background: var(--c); align-items: center; justify-content: center; font-style: normal; margin-bottom: 3px; }
      .chk { width: 18px; height: 18px; border-radius: 5px; box-shadow: inset 0 0 0 2px var(--line); flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font: 700 12px var(--body); }
      .chk.on { background: var(--accent); box-shadow: none; }
      .win { font: 40px/1.25 var(--pixel); color: var(--accent); letter-spacing: 2px; }
      .score { font: 700 26px var(--data); }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }

      /* Narrow screens: HUD stacks, the card becomes a bottom sheet above the bar. */
      @media (max-width: 760px) {
        :root { --gutter: 12px; }
        .hud { height: 44px; padding: 0 12px; gap: 10px; }
        .hud.right { top: 68px; }
        .hud .lbl { display: none; }
        .hint, .chip { top: 124px; }
        .card { left: var(--gutter); right: var(--gutter); width: auto; top: auto; bottom: 128px; max-height: 46vh; }
        .bar { grid-template-columns: auto 1fr; }
        .bar .r { display: none; }
        .esc { width: 100%; font-size: 16px; }
        .hint, .source, .chip { white-space: normal; width: calc(100vw - 24px); text-align: center; }
        .win { font-size: 26px; }
      }
    </style>
  </head>
  <body>
    <div id="viewer" data-view="shaded" aria-label="3D isometric model of the building"></div>

    <header class="hud glass left">
      <h1 class="word">ESCAPE PLAN</h1>
      <span class="lbl" id="where"></span>
    </header>
    <div class="hud glass right" aria-live="polite">
      <span class="pips" id="pips"></span>
      <span class="count" id="count">0/4</span>
      <span class="lbl">Escaped</span>
      <span class="b b-acc" id="badge">READY</span>
    </div>

    <p class="hint glass" id="hint">Choose an object and get it out of the building</p>
    <div class="chip" id="banner" role="status" hidden></div>
    <aside class="card glass" id="card" aria-live="polite" hidden></aside>

    <nav class="bar" aria-label="Actions">
      <div><button class="pill glass" id="reset" type="button">RESET</button></div>
      <div><button class="esc" id="primary" type="button">CHOOSE OBJECT</button></div>
      <div class="r"><div class="views glass" id="views" aria-label="View"></div></div>
    </nav>

    <p class="source glass" id="source" hidden>Results from data/expected.json until the solver has these rules</p>

    <div class="scrim" id="scrim" hidden></div>
    <div class="dlg" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" hidden></div>

    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
