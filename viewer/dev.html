<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape Plan viewer dev</title>
    <style>
      body { margin: 0; background: #eef2f8; color: #0f172a; font-family: system-ui, sans-serif; display: grid;
        grid-template-rows: auto 1fr; height: 100vh; }
      header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #c3cde2; }
      button { font: 700 13px system-ui, sans-serif; padding: 8px 14px; background: rgba(47, 91, 255, 0.12); color: #2146d6;
        border: 0; border-radius: 9999px; cursor: pointer; }
      button[aria-pressed='true'] { background: #2f5bff; color: #fff; }
      #source { font-size: 13px; color: #475569; }
      #viewer { position: relative; min-height: 0; }
    </style>
  </head>
  <body>
    <header>
      <strong>VIEWER DEV</strong>
      <span id="cases"></span>
      <span id="source"></span>
    </header>
    <div id="viewer"></div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
