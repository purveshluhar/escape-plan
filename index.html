<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Escape Plan</title>
<style>
/* Design B: daylight model, spatial glass. The model fills the screen; light glass floats over it:
   the summary pill at the top, the dock at the bottom, the fix sheet and the edit box above it. */
:root{
  color-scheme: light;
  --ink:#14161c; --muted:#3d4250; --pass:#05592c; --fail:#9a0f19; --esc:#1b1e24; --focus:#1d3fd6;
  --g-top:rgba(250,251,253,.74); --g-bot:rgba(236,240,246,.66); --blur:16px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --s2:8px;
  --spring:cubic-bezier(.34,1.36,.64,1); --soft:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);
  background:linear-gradient(180deg,#c9d8ea 0%,#e6ebf0 55%,#f4efe6 100%);-webkit-font-smoothing:antialiased}
#viewer{position:fixed;inset:0}
/* The app shows LEVEL COMPLETE in its own banner, with the line under it. */
#viewer .ep-banner{display:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Light liquid glass ---------- */
.glass{position:relative;isolation:isolate;pointer-events:auto;
  background:rgba(246,248,251,.97);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:inset 0 1px 0 #fff, inset 0 0 0 1px rgba(255,255,255,.35), inset 0 -1px 0 rgba(40,60,90,.10),
    0 0 0 1px rgba(30,45,70,.13), 0 18px 40px -16px rgba(30,40,60,.34), 0 2px 6px rgba(30,40,60,.08);}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:linear-gradient(180deg,var(--g-top),var(--g-bot));
    -webkit-backdrop-filter:blur(var(--blur)) saturate(1.5) brightness(1.04);backdrop-filter:blur(var(--blur)) saturate(1.5) brightness(1.04)}
}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.7) 0,rgba(255,255,255,.18) 22%,rgba(255,255,255,0) 45%),
    linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.28) 50%,rgba(255,255,255,0) 60%),
    radial-gradient(80% 60% at 90% 120%,rgba(150,175,215,.30),rgba(150,175,215,0) 60%)}
@media (prefers-reduced-transparency: reduce){
  .glass{background:#f7f6f3 !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;border-color:#8a8f9a !important}
  .glass::before{display:none}
}

/* ---------- Glyph dots ---------- */
.dot{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;
  background:var(--c);border:2px solid var(--ink);color:var(--gi,var(--ink));font:700 15px/1 var(--font)}
.dot.sm{width:24px;height:24px;font-size:13px}
kbd{font:600 12px/1 ui-monospace,Menlo,monospace;padding:3px 6px;border-radius:6px;color:var(--muted);
  background:rgba(20,22,28,.06);border:1px solid rgba(20,22,28,.16)}
.word{font-weight:700;letter-spacing:.02em}
.word.pass{color:var(--pass)} .word.fail{color:var(--fail)} .word.ready{color:var(--muted);font-weight:600}

/* ---------- Dock (bottom capsule) ---------- */
#dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);border-radius:999px;padding:8px;
  display:flex;align-items:center;max-width:calc(100vw - 24px);transition:padding .5s var(--spring)}
#dock.pop{animation:settle .6s var(--spring)}
@keyframes settle{from{transform:translateX(-50%) scale(.94);opacity:.6}to{transform:translateX(-50%) scale(1);opacity:1}}
.dock-full{display:flex;align-items:center;gap:var(--s2);min-width:0}
#picker{display:flex;gap:8px;align-items:center}
.scrollwrap{position:relative;min-width:0;display:flex;flex:1}
.scroller{display:flex;align-items:center;gap:var(--s2);min-width:0;overflow-x:auto;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 14px 0 9px;border-radius:999px;
  background:rgba(255,255,255,.5);border:1px solid rgba(20,22,28,.10);font:600 16px/1 var(--font);white-space:nowrap;
  transition:background .3s var(--soft),transform .4s var(--spring)}
.chip:hover:not(:disabled){background:rgba(255,255,255,.9)}
.chip:active:not(:disabled){transform:scale(.97)}
.chip[aria-pressed="true"]{background:#fff;border:1px solid rgba(20,22,28,.6);box-shadow:0 1px 3px rgba(20,22,28,.10)}
.chip:disabled{color:#4a4f5a;background:rgba(255,255,255,.3);border-style:dashed;height:40px;font-size:14px;padding:0 12px 0 6px;gap:7px}
.chip:disabled .dot{width:24px;height:24px;font-size:12px}
.later{font:600 13px/1 var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:0 2px 0 10px}
.sep{width:1px;height:30px;background:rgba(20,22,28,.16);flex:none}
.tool{height:42px;padding:0 13px;border-radius:999px;background:transparent;border:1px solid rgba(20,22,28,.10);
  font:600 15px/1 var(--font);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tool:hover:not(:disabled){background:rgba(255,255,255,.7)}
.tool:disabled{color:#5a5f6a}
.tools{display:flex;gap:6px}
#btnEscape{flex:none;height:58px;padding:0 26px 0 30px;border-radius:999px;margin-left:var(--s2);
  display:inline-flex;align-items:center;gap:12px;font:700 21px/1 var(--font);color:#fff;
  background:linear-gradient(180deg,#30343c,#16181d);border:1px solid rgba(20,22,28,.9);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 20px -10px rgba(20,22,28,.55);
  transition:transform .4s var(--spring),box-shadow .4s var(--soft)}
#btnEscape kbd{color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
#btnEscape:hover:not(:disabled){transform:translateY(-1px)}
#btnEscape:disabled{color:#4a4f5a;background:rgba(20,22,28,.07);border:1px solid rgba(20,22,28,.14);box-shadow:none}
#btnEscape:disabled kbd{color:#4a4f5a;background:rgba(20,22,28,.05);border-color:rgba(20,22,28,.14)}
.dock-slim{display:none;align-items:center;gap:12px;padding:6px 18px 6px 10px;font:600 16px/1 var(--font)}
#dock.slim{padding:6px}
#dock.slim .dock-full{display:none}
#dock.slim .dock-slim{display:flex}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(20,22,28,.18);border-top-color:var(--esc);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Summary pill (top centre) and scoreboard ---------- */
#summary{position:fixed;top:16px;left:50%;transform:translateX(-50%);border-radius:999px;
  display:flex;align-items:center;gap:14px;padding:8px 12px 8px 22px;font:400 18px/1.1 var(--font);white-space:nowrap;
  border:1px solid rgba(255,255,255,.8);max-width:calc(100vw - 24px);min-height:48px}
#summary .sline{display:flex;align-items:center;gap:14px}
#summary .phase{font-weight:700}
#summary .vbar{width:1px;height:24px;background:rgba(20,22,28,.18)}
.schips{display:flex;gap:6px}
.schip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid rgba(20,22,28,.10)}
.schip .word{font-size:20px}
.caret{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(20,22,28,.06)}
.caret::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-2px) rotate(45deg);transition:transform .4s var(--spring)}
#summary[aria-expanded="true"] .caret::after{transform:translateY(2px) rotate(225deg)}
#scorePanel{position:fixed;top:78px;left:50%;transform:translateX(-50%);border-radius:28px;padding:10px 16px;
  width:min(560px,calc(100vw - 24px));display:none}
#scorePanel.open{display:block;animation:fadeup .4s var(--soft)}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(20,22,28,.08)}
.srow:last-child{border-bottom:0}
.srow .nm{font:600 17px/1.2 var(--font)} .srow .word{font-size:20px}
.srow .det{grid-column:2 / 4;font:400 16px/1.35 var(--font);color:var(--muted)}
@keyframes fadeup{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

#note{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- LEVEL COMPLETE ---------- */
#banner{position:fixed;left:0;right:0;top:104px;text-align:center;pointer-events:none;display:none}
#banner.on{display:block;animation:bannerIn .9s var(--spring)}
#banner .big{font:800 clamp(40px,5.2vw,76px)/1 var(--font);letter-spacing:.03em;color:var(--ink)}
#banner .sub{margin-top:10px;font:500 20px/1.3 var(--font);color:var(--muted)}
@keyframes bannerIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- Buttons in panels ---------- */
.fixbtn{height:46px;padding:0 18px;border-radius:999px;font:600 16px/1 var(--font);text-align:left;white-space:nowrap;
  background:rgba(255,255,255,.92);border:1px solid rgba(20,22,28,.22);box-shadow:0 1px 0 #fff inset,0 2px 6px rgba(28,34,52,.08);
  transition:transform .4s var(--spring),background .3s}
.fixbtn:hover:not(:disabled){background:#fff;transform:translateY(-1px)}
.fixbtn.ghost{background:transparent;border-color:rgba(20,22,28,.16);font-weight:500}
.fixbtn[aria-pressed="true"]{background:rgba(37,70,216,.08);border-color:rgba(37,70,216,.5)}
.fixbtn:disabled{color:#5a5f6a;border-style:dashed;background:transparent}

/* ---------- Fix sheet: one card per failed object ---------- */
#sheet{position:fixed;right:24px;bottom:104px;width:min(380px,calc(100vw - 16px));max-height:calc(100vh - 200px);overflow-y:auto;
  border-radius:28px;padding:10px 10px 8px;display:none}
#sheet.on{display:block;animation:sheetIn .5s var(--spring)}
#sheet .lbl{font:600 12px/1 var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:4px 8px 8px}
.fcard{padding:10px 8px;border-bottom:1px solid rgba(20,22,28,.08)}
.fcard .top{display:flex;align-items:center;gap:10px}
.fcard .nm{font:600 17px/1.1 var(--font)}
.fcard .word{font-size:20px;margin-left:auto}
.fcard .rs{margin:8px 0 2px 2px;font:600 16px/1.25 var(--font)}
.fcard .rs span{font-weight:400}
.fcard .nb{margin-left:2px;font:400 15px/1.3 var(--font);color:var(--muted)}
.fcard .fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fcard .fx .fixbtn{height:42px;font-size:15px;padding:0 14px;white-space:normal;line-height:1.15}
.morebtn{background:none;border:0;padding:6px 8px;font:500 15px/1 var(--font);color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.morebtn:hover{color:var(--ink)}
.fcard .none{font:400 15px/1.3 var(--font);color:var(--muted);margin-top:8px}
#sheet .foot{display:flex;gap:6px;margin-top:8px}
#sheet .foot .fixbtn{flex:1;height:40px;text-align:center}

/* ---------- Edit box (typed edits) ---------- */
#editPanel{position:fixed;right:24px;bottom:104px;width:min(520px,calc(100vw - 16px));
  border-radius:30px;padding:14px;display:none}
#editPanel.open{display:block;animation:sheetIn .45s var(--soft)}
#editPanel .row{display:flex;gap:8px;align-items:center}
#editPanel .ehead{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px 8px}
#editPanel .ehead .tool{height:36px;font-size:14px}
#editPanel label{display:block;font:600 13px/1 var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
#editInput{flex:1;min-width:0;height:50px;border-radius:999px;border:1px solid rgba(20,22,28,.22);background:rgba(255,255,255,.92);
  padding:0 20px;font:400 17px/1 var(--font);color:var(--ink)}
#editInput::placeholder{color:#5a5f6a}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick .fixbtn{height:40px;font-size:15px;padding:0 14px}
#editPanel.err .quick{display:none}
#jev{display:none;margin-top:12px;padding:12px 12px 4px;border-top:1px solid rgba(20,22,28,.10)}
#jev.on{display:block}
#jev .q{font:400 17px/1.35 var(--font);margin:0 4px 4px}
#jev .q b{font-weight:700}
#jev .dym{font:700 20px/1.2 var(--font);margin:10px 4px 8px}
#jev .opts{display:flex;flex-wrap:wrap;gap:6px}
#jev .src{font:400 13px/1.3 var(--font);color:var(--muted);margin:10px 4px 6px}

/* ---------- Compact (phone) ---------- */
@media (max-width:700px){
  #dock{left:8px;right:8px;bottom:8px;transform:none;padding:6px;max-width:none;border-radius:30px}
  .dock-full{flex-wrap:wrap;row-gap:6px;width:100%}
  #picker{flex-basis:100%}
  #picker .chip{flex:1;min-width:0;justify-content:center;height:44px;padding:0 8px 0 5px;gap:6px;font-size:14px}
  #picker .dot{width:24px;height:24px;font-size:13px}
  .scroller{flex:1;padding:2px 22px 2px 2px;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent 96%)}
  .scroller > .sep:first-of-type{display:none}
  #dock.pop{animation:none}
  .chip{height:46px;font-size:15px}
  .tools{order:-1}
  #btnEscape{height:52px;padding:0 18px;font-size:18px;margin-left:4px}
  #btnEscape kbd{display:none}
  #dock.slim{left:50%;right:auto;transform:translateX(-50%)}
  #summary{top:30px;padding:8px 10px 8px 16px;gap:10px;font-size:16px;flex-wrap:wrap;justify-content:center;border-radius:28px;row-gap:8px;width:max-content;white-space:normal}
  #summary .vbar,#summary .caret,.chip kbd,.glabel{display:none}
  #summary .sline{flex-basis:100%;justify-content:center;gap:8px}
  .schip .word{font-size:16px}
  #scorePanel{top:120px}
  #sheet{left:8px;right:8px;width:auto;bottom:136px;max-height:45vh}
  #editPanel{bottom:136px;left:8px;right:8px;width:auto}
  #banner{top:128px}
  #banner .sub{font-size:16px}
}
@keyframes sheetIn{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div id="viewer" aria-label="3D model of the building" role="img"></div>
<div id="hud">
  <nav id="dock" class="glass" aria-label="Game controls">
    <div class="dock-full">
      <div id="picker" role="group" aria-label="Pick an object"><span class="later glabel" aria-hidden="true">Place</span></div>
      <div class="scrollwrap"><div class="scroller">
        <span class="sep" aria-hidden="true"></span>
        <div class="tools">
          <button type="button" class="tool" id="btnEdit" aria-label="Type an edit">Edit <kbd>/</kbd></button>
          <button type="button" class="tool" id="btnReset">Reset <kbd>R</kbd></button>
          <button type="button" class="tool" id="btnClear">Clear</button>
        </div>
      </div></div>
      <button type="button" id="btnEscape" aria-describedby="escHint">Escape! <kbd>Space</kbd></button>
    </div>
    <div class="dock-slim" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="slimText">Running</span></div>
  </nav>
  <button type="button" id="summary" class="glass" aria-expanded="false" aria-controls="scorePanel"></button>
  <div id="scorePanel" class="glass" role="region" aria-label="Scoreboard"></div>
  <div id="note" role="status"></div>
  <div id="banner" role="status"><div class="big">LEVEL COMPLETE</div><div class="sub" id="bannerSub">Every object got out of the building</div></div>
  <div id="sheet" class="glass" role="region" aria-label="Fixes"></div>
  <div id="editPanel" class="glass" role="dialog" aria-label="Type an edit">
    <div class="ehead"><label for="editInput">Type an edit</label><button type="button" class="tool" id="editClose">Close <kbd>Esc</kbd></button></div>
    <form class="row" id="editForm" autocomplete="off">
      <input id="editInput" type="text" placeholder="For example: widen the lobby door to 1.6 m" />
      <button type="submit" class="fixbtn">Apply</button>
    </form>
    <div class="quick" id="quick"></div>
    <div id="jev" role="alert"></div>
  </div>
  <span id="escHint" hidden>Place an object first</span>
</div>
<script type="module" src="/app/main.ts"></script>
</body>
</html>
