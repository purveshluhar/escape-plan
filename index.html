<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape Plan</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #0b0f1a; color: #e8ecff; display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
      #viewer { position: relative; }
      aside { padding: 16px; border-left: 1px solid #1c2440; }
      h1 { font-size: 20px; letter-spacing: 0.1em; margin: 0 0 12px; }
      button { font: inherit; font-weight: 700; padding: 10px 18px; border: 2px solid #39ff88; background: transparent; color: #39ff88; border-radius: 8px; cursor: pointer; }
      ul { list-style: none; padding: 0; }
      li { padding: 6px 8px; margin: 4px 0; border-left: 4px solid var(--token); }
      li[data-status='fail'] { color: #ffb3c0; }
      #banner { font-size: 28px; font-weight: 800; color: #39ff88; }
      .note { opacity: 0.6; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <aside>
      <h1>ESCAPE PLAN</h1>
      <button id="escape">Escape!</button>
      <ul id="scoreboard"></ul>
      <div id="banner"></div>
      <p class="note">Starter build: the solver is a stub until P1 adds token rules.</p>
    </aside>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
